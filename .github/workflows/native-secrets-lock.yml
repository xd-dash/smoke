name: Pin native secrets dependency graph
on:
  push:
    branches: [codex/sops-age-native-bootstrap]
    paths:
      - 'go.mod'
      - 'secrets/**'
      - 'cmd/ghxd-minimal/**'
      - '.github/workflows/native-secrets-lock.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Resolve locked Go module dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add go.mod go.sum
            git commit -m "Lock native SOPS age dependency graph"
            git push origin HEAD:codex/sops-age-native-bootstrap
          }
