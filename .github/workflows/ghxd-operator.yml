name: Smoke GHXD operator qualification

on:
  push:
    branches:
      - 'v*'
  pull_request:
    paths:
      - 'local/ghxd/**'
      - '.github/workflows/ghxd-operator.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate delegated host actions and credential operator
        run: |
          bash -n local/ghxd/operator.sh local/ghxd/host-operator.sh local/ghxd/test-source-generation.sh
          sh -n local/ghxd/activate-source-generation.sh
          for action in local/ghxd/host-actions/*.sh; do bash -n "$action"; done
      - name: Validate dated and immutable GitHub sources
        run: |
          python3 local/ghxd/test-source-version.py
          bash local/ghxd/test-source-generation.sh
      - name: Check Smoke-native Nix flake declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          flake=Path("flake.nix").read_text()
          assert 'smokeSource = ./.;' in flake
          assert 'fetchGit' not in flake
          assert 'source-build' in flake and 'credential-runtime-adapter' in flake
          assert 'exec ${pkgs.bash}/bin/bash ${./local/ghxd/operator.sh}' in flake
          assert not Path("local/ghxd/flake.nix").exists()
          PY
