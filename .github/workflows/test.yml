name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify Go-native module workspace composition
        shell: bash
        env:
          SMOKE_ENV_DIR: ${{ runner.temp }}/smoke-envs
          GOPROXY: direct
          GONOSUMDB: github.com/dash-xd/github-cdn
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          go build -o "$smoke" ./cmd/smoke

          "$smoke" env create native
          resolved="$("$smoke" env module add native github.com/dash-xd/github-cdn@go)"
          [[ "$resolved" == github.com/dash-xd/github-cdn@v* ]]

          modules="$("$smoke" env module list native)"
          grep -F 'github.com/dash-xd/github-cdn' <<<"$modules"

          work="$SMOKE_ENV_DIR/native/go.work"
          grep -F 'github.com/dash-xd/github-cdn@' <<<"$(go env GOMODCACHE >/dev/null; printf '%s' "$resolved")"
          GOWORK="$work" go work edit -json >/dev/null
      - name: Verify built-in ghxd libraries and worktree bootstrap
        shell: bash
        env:
          SMOKE_ENV_DIR: ${{ runner.temp }}/smoke-ghxd-envs
          GOPROXY: direct
          GONOSUMDB: github.com/dash-xd/github-cdn,github.com/dash-xd/github-device-auth,github.com/xd-dash/smoke
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke-ghxd"
          go build -o "$smoke" ./cmd/smoke

          "$smoke" commands | grep -Fx logmash
          "$smoke" commands | grep -Fx ghxd

          "$smoke" ghxd show | grep -Fx $'builtin\tauth'
          "$smoke" ghxd show | grep -Fx $'builtin\tcdn'
          "$smoke" ghxd show | grep -Fx $'environment\tghxd'
          "$smoke" ghxd show | grep -Fx $'tool\tgithub.com/xd-dash/smoke/cmd/github-worktree@599b3ffb7b0437ed10c80e8677d15a40e954901c'
          ! "$smoke" ghxd show | grep -F 'github-cdn@'
          ! "$smoke" ghxd show | grep -F 'github-device-auth/cmd/'

          "$smoke" ghxd bootstrap
          "$smoke" ghxd bootstrap
          tools="$SMOKE_ENV_DIR/ghxd/tools/go.mod"
          grep -F 'github.com/xd-dash/smoke/cmd/github-worktree' "$tools"
          ! grep -F 'github.com/dash-xd/github-cdn' "$tools"
          ! grep -F 'github.com/dash-xd/github-device-auth' "$tools"
          ! grep -F 'github.com/dash-xd/agni' "$tools"

          tool_list="$("$smoke" env tool list ghxd)"
          grep -F github-worktree <<<"$tool_list"
          ! grep -F github-cdn <<<"$tool_list"
          ! grep -F github-device-auth <<<"$tool_list"

          "$smoke" env create provider-test
          "$smoke" ghxd apply provider-test
          provider_tools="$SMOKE_ENV_DIR/provider-test/tools/go.mod"
          grep -F 'github.com/xd-dash/smoke/cmd/github-worktree' "$provider_tools"
          ! grep -F 'github.com/dash-xd/github-cdn' "$provider_tools"
          ! grep -F 'github.com/dash-xd/github-device-auth' "$provider_tools"

          auth_usage="$($smoke ghxd auth 2>&1 || true)"
          grep -F 'usage: smoke ghxd auth' <<<"$auth_usage"
          cdn_no_token="$(env -u GH_TOKEN -u GITHUB_TOKEN "$smoke" ghxd cdn snapshot xd-dash smoke main 2>&1 || true)"
          grep -F 'GH_TOKEN or GITHUB_TOKEN is required' <<<"$cdn_no_token"

          destination="$RUNNER_TEMP/ghxd-worktree"
          result="$($smoke ghxd worktree seed \
            --repository xd-dash/smoke \
            --sha "$GITHUB_SHA" \
            --destination "$destination" \
            --object-root "$RUNNER_TEMP/ghxd-git-components")"
          jq -e --arg sha "$GITHUB_SHA" '.sha == $sha and .detached == true and .clean == true and (.object_database | length > 0)' <<<"$result"
          [[ "$(git -C "$destination" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git -C "$destination" status --porcelain)" ]]
          [[ -z "$(git -C "$destination" symbolic-ref -q HEAD || true)" ]]
