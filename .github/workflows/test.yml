name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smoke-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required for:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build all commands
        run: go build ./cmd/...
      - name: Verify module metadata is tidy
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod "$RUNNER_TEMP/go.mod.before"
          if [[ -f go.sum ]]; then cp go.sum "$RUNNER_TEMP/go.sum.before"; else : > "$RUNNER_TEMP/go.sum.before"; fi
          go mod tidy
          cmp -s go.mod "$RUNNER_TEMP/go.mod.before" || { diff -u "$RUNNER_TEMP/go.mod.before" go.mod || true; exit 1; }
          if [[ -f go.sum ]]; then cmp -s go.sum "$RUNNER_TEMP/go.sum.before" || { diff -u "$RUNNER_TEMP/go.sum.before" go.sum || true; exit 1; }; fi

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...

  composition:
    name: smoke-composition
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify Go-native module workspace composition
        shell: bash
        env:
          SMOKE_ENV_DIR: ${{ runner.temp }}/smoke-envs
          GOPROXY: direct
          GONOSUMDB: github.com/dash-xd/github-cdn
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          go build -o "$smoke" ./cmd/smoke
          "$smoke" env create native
          resolved="$("$smoke" env module add native github.com/dash-xd/github-cdn@go)"
          [[ "$resolved" == github.com/dash-xd/github-cdn@v* ]]
          "$smoke" env module list native | grep -F 'github.com/dash-xd/github-cdn'
          GOWORK="$SMOKE_ENV_DIR/native/go.work" go work edit -json >/dev/null
      - name: Verify default Logmash composition and ghxd workspace
        shell: bash
        env:
          SMOKE_ENV_DIR: ${{ runner.temp }}/smoke-ghxd-envs
          SMOKE_DATA_HOME: ${{ runner.temp }}/smoke-data
          GOPROXY: direct
          GONOSUMDB: github.com/dash-xd/github-cdn,github.com/dash-xd/github-device-auth,github.com/xd-dash/smoke
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke-ghxd"
          ghxd="$RUNNER_TEMP/ghxd"
          go build -o "$smoke" ./cmd/smoke
          go build -o "$ghxd" ./cmd/ghxd
          "$smoke" commands | grep -Fx logmash
          "$smoke" commands | grep -Fx ghxd
          "$smoke" ghxd show | grep -Fx $'environment\tghxd'
          "$smoke" ghxd show | grep -Fx $'tool\tgithub.com/dash-xd/github-cdn@6c00e9533d91906c97da7ebfb262104466da27ed'
          "$smoke" ghxd show | grep -Fx $'tool\tgithub.com/dash-xd/github-device-auth/cmd/github-device-auth@ba459bf3ca4bdfea178ffdbdf84d365ec6a81fe4'
          "$smoke" ghxd show | grep -Fx $'tool\tgithub.com/xd-dash/smoke/cmd/github-worktree@599b3ffb7b0437ed10c80e8677d15a40e954901c'
          "$smoke" ghxd bootstrap
          "$smoke" ghxd bootstrap
          tools="$SMOKE_ENV_DIR/ghxd/tools/go.mod"
          grep -F 'github.com/dash-xd/github-cdn' "$tools"
          grep -F 'github.com/dash-xd/github-device-auth' "$tools"
          grep -F 'github.com/xd-dash/smoke/cmd/github-worktree' "$tools"
          "$smoke" env create provider-test
          "$smoke" ghxd apply provider-test
          "$ghxd" show | grep -Fx $'environment\tghxd'
          destination="$RUNNER_TEMP/ghxd-worktree"
          result="$($smoke ghxd worktree seed --repository xd-dash/smoke --sha "$GITHUB_SHA" --destination "$destination" --object-root "$RUNNER_TEMP/ghxd-git-components")"
          jq -e --arg sha "$GITHUB_SHA" '.sha == $sha and .detached == true and .clean == true and (.object_database | length > 0)' <<<"$result"
          [[ "$(git -C "$destination" rev-parse HEAD)" == "$GITHUB_SHA" ]]
